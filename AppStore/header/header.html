<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- The App Store product page header (iOS 27 / iPadOS 27): 3840 x 1646, 21:9.
     Drawn at 1920 x 823 CSS pixels and captured at 2x. No text: the app's icon
     and name sit just under it, and words would need all nine languages. The
     focal point (the jellygoose, drawn from Tools/render-icon.swift's geometry)
     stays in the middle, where every crop keeps it; the screens around it are
     made-up scenes, no one's films. -->
<style>
  html, body { margin: 0; width: 1920px; height: 823px; overflow: hidden; background: #070A16; }
  .stage { position: relative; width: 1920px; height: 823px; overflow: hidden;
    background:
      radial-gradient(ellipse 62% 70% at 50% 18%, #1D2A5C 0%, rgba(18,26,56,.75) 45%, rgba(7,10,22,0) 100%),
      radial-gradient(ellipse 38% 46% at 50% 58%, rgba(122,69,230,.20) 0%, rgba(122,69,230,0) 100%),
      linear-gradient(#0A1024, #070A16 70%, #05070F); }
  .ray { position: absolute; top: -120px; width: 150px; height: 1100px; transform-origin: top center;
    background: linear-gradient(rgba(150,180,255,.16), rgba(150,180,255,0) 80%); filter: blur(24px); }
  .bubble { position: absolute; border-radius: 50%; background: rgba(127,166,216,.28); }
  .halo { position: absolute; left: 960px; top: 400px; width: 1100px; height: 900px; transform: translate(-50%, -50%);
    background: radial-gradient(closest-side, rgba(122,69,230,.30), rgba(0,144,219,.10) 55%, rgba(0,0,0,0)); }
  .card { position: absolute; border-radius: 16px; overflow: hidden;
    box-shadow: 0 24px 60px rgba(0,0,0,.55), 0 0 40px rgba(110,90,240,.22);
    outline: 1.5px solid rgba(255,255,255,.14); outline-offset: -1.5px; }
  .card svg { display: block; width: 100%; height: 100%; }
  .card::after { content: ""; position: absolute; inset: 0; border-radius: inherit;
    background: linear-gradient(135deg, rgba(255,255,255,.14), rgba(255,255,255,0) 40%); }
  .far { filter: blur(2.6px) saturate(.8) brightness(.72); }
  .mid { filter: blur(.9px) brightness(.88); }
  .goose { position: absolute; left: 960px; top: 405px; transform: translate(-50%, -50%); width: 640px; height: 736px; }
</style>
</head>
<body>
<div class="stage">
  <!-- Light from the surface, falling past the middle. -->
  <div class="ray" style="left: 700px; transform: rotate(14deg); opacity: .9"></div>
  <div class="ray" style="left: 900px; transform: rotate(6deg); width: 110px; opacity: .7"></div>
  <div class="ray" style="left: 1060px; transform: rotate(-4deg); width: 170px; opacity: .8"></div>
  <div class="ray" style="left: 1250px; transform: rotate(-13deg); width: 120px; opacity: .55"></div>
  <div class="ray" style="left: 480px; transform: rotate(22deg); width: 90px; opacity: .45"></div>

  <div id="bubbles"></div>
  <div class="halo"></div>

  <!-- Far screens, small and soft. -->
  <div class="card far" style="left: 150px; top: 96px; width: 190px; height: 107px; transform: rotate(-5deg)">
    <svg viewBox="0 0 160 90" preserveAspectRatio="xMidYMid slice"><defs>
      <linearGradient id="aurSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#04121f"/><stop offset="1" stop-color="#0b2f3f"/></linearGradient>
      <linearGradient id="aur" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3cffb0" stop-opacity="0"/><stop offset=".3" stop-color="#3cffb0" stop-opacity=".8"/><stop offset=".7" stop-color="#a46bff" stop-opacity=".7"/><stop offset="1" stop-color="#a46bff" stop-opacity="0"/></linearGradient></defs>
      <rect width="160" height="90" fill="url(#aurSky)"/>
      <path d="M-5 40 C30 10 60 50 95 25 S150 20 170 35 L170 50 C140 35 110 60 80 45 S20 45 -5 60Z" fill="url(#aur)" opacity=".85"/>
      <path d="M0 78 L25 60 L45 72 L70 52 L95 70 L120 56 L160 76 L160 90 L0 90Z" fill="#06101a"/></svg>
  </div>
  <div class="card far" style="left: 600px; top: 52px; width: 104px; height: 156px; transform: rotate(4deg)">
    <svg viewBox="0 0 100 150" preserveAspectRatio="xMidYMid slice"><defs>
      <linearGradient id="fog" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7fd1a8"/><stop offset="1" stop-color="#0f3b2e"/></linearGradient></defs>
      <rect width="100" height="150" fill="url(#fog)"/>
      <g fill="#0b2a20"><path d="M10 150 L22 95 L34 150Z"/><path d="M28 150 L44 80 L60 150Z"/><path d="M55 150 L70 100 L85 150Z"/><path d="M72 150 L90 70 L108 150Z"/></g>
      <g fill="#061a14"><path d="M-6 150 L8 110 L22 150Z"/><path d="M40 150 L52 115 L64 150Z"/><path d="M80 150 L94 112 L108 150Z"/></g></svg>
  </div>
  <div class="card far" style="left: 1690px; top: 330px; width: 200px; height: 113px; transform: rotate(6deg)">
    <svg viewBox="0 0 160 90" preserveAspectRatio="xMidYMid slice"><defs>
      <linearGradient id="roseBg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a0f2a"/><stop offset="1" stop-color="#5e1d4a"/></linearGradient>
      <radialGradient id="planet" cx=".35" cy=".35" r=".8"><stop offset="0" stop-color="#ffb0d0"/><stop offset=".6" stop-color="#d0457f"/><stop offset="1" stop-color="#5a1640"/></radialGradient></defs>
      <rect width="160" height="90" fill="url(#roseBg)"/>
      <g fill="#fff" opacity=".7"><circle cx="20" cy="18" r=".9"/><circle cx="140" cy="14" r="1.1"/><circle cx="120" cy="70" r=".8"/><circle cx="36" cy="66" r="1"/><circle cx="64" cy="10" r=".7"/></g>
      <circle cx="82" cy="46" r="22" fill="url(#planet)"/>
      <ellipse cx="82" cy="47" rx="40" ry="9" fill="none" stroke="#ffc6dc" stroke-width="2.4" opacity=".75" transform="rotate(-14 82 47)"/></svg>

  <!-- Middle distance. -->
  <div class="card mid" style="left: 352px; top: 300px; width: 176px; height: 264px; transform: rotate(6deg)">
    <svg viewBox="0 0 100 150" preserveAspectRatio="xMidYMid slice"><defs>
      <linearGradient id="dawn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff8a5c"/><stop offset=".6" stop-color="#ffcf7a"/><stop offset="1" stop-color="#ffe3a8"/></linearGradient></defs>
      <rect width="100" height="150" fill="url(#dawn)"/>
      <circle cx="62" cy="78" r="16" fill="#fff4cf"/>
      <path d="M0 96 L22 70 L40 88 L60 62 L82 86 L100 74 L100 150 L0 150Z" fill="#8a3a52"/>
      <path d="M0 112 L18 96 L38 110 L58 92 L78 108 L100 98 L100 150 L0 150Z" fill="#5a2244"/>
      <path d="M0 128 L26 116 L50 126 L74 114 L100 124 L100 150 L0 150Z" fill="#2c1230"/></svg>
  </div>
  <div class="card mid" style="left: 1408px; top: 400px; width: 180px; height: 270px; transform: rotate(-5deg)">
    <svg viewBox="0 0 100 150" preserveAspectRatio="xMidYMid slice"><defs>
      <linearGradient id="blueHour" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#14215e"/><stop offset=".55" stop-color="#4a6fd4"/><stop offset="1" stop-color="#c4a8ec"/></linearGradient></defs>
      <rect width="100" height="150" fill="url(#blueHour)"/>
      <circle cx="74" cy="30" r="7" fill="#f3f0d8" opacity=".95"/>
      <g fill="#0d1233"><rect x="4" y="88" width="14" height="62"/><rect x="20" y="70" width="16" height="80"/><rect x="38" y="96" width="12" height="54"/><rect x="52" y="58" width="18" height="92"/><rect x="72" y="84" width="12" height="66"/><rect x="86" y="74" width="14" height="76"/></g>
      <g fill="#ffd36b"><rect x="24" y="78" width="2.4" height="2.4"/><rect x="30" y="90" width="2.4" height="2.4"/><rect x="56" y="66" width="2.4" height="2.4"/><rect x="62" y="80" width="2.4" height="2.4"/><rect x="56" y="98" width="2.4" height="2.4"/><rect x="89" y="84" width="2.4" height="2.4"/><rect x="8" y="98" width="2.4" height="2.4"/><rect x="75" y="96" width="2.4" height="2.4"/><rect x="42" y="106" width="2.4" height="2.4"/><rect x="64" y="112" width="2.4" height="2.4"/></g></svg>
  </div>

  <!-- Near screens, large and sharp, out at the sides. -->
  <div class="card" style="left: 70px; top: 520px; width: 380px; height: 214px; transform: rotate(-4deg)">
    <svg viewBox="0 0 160 90" preserveAspectRatio="xMidYMid slice"><defs>
      <linearGradient id="sunsetSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5b3fa8"/><stop offset=".5" stop-color="#ff7e5f"/><stop offset="1" stop-color="#feb47b"/></linearGradient>
      <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b4c7e"/><stop offset="1" stop-color="#121c38"/></linearGradient>
      <linearGradient id="prog" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7a45e6"/><stop offset="1" stop-color="#0090db"/></linearGradient></defs>
      <rect width="160" height="54" fill="url(#sunsetSky)"/>
      <circle cx="96" cy="54" r="15" fill="#ffe7a8"/>
      <rect y="54" width="160" height="36" fill="url(#sea)"/>
      <g stroke="#ffd9a0" stroke-linecap="round" opacity=".8"><line x1="86" y1="59" x2="106" y2="59" stroke-width="1.6"/><line x1="89" y1="64" x2="103" y2="64" stroke-width="1.4"/><line x1="92" y1="69" x2="100" y2="69" stroke-width="1.2"/><line x1="94" y1="74" x2="98" y2="74" stroke-width="1"/></g>
      <rect x="8" y="83" width="144" height="2.4" rx="1.2" fill="#fff" opacity=".28"/>
      <rect x="8" y="83" width="92" height="2.4" rx="1.2" fill="url(#prog)"/></svg>
  </div>
  <div class="card" style="left: 1480px; top: 70px; width: 370px; height: 208px; transform: rotate(4deg)">
    <!-- Four channels at once: Multiview. -->
    <svg viewBox="0 0 160 90" preserveAspectRatio="xMidYMid slice"><defs>
      <radialGradient id="neb" cx=".4" cy=".4" r=".8"><stop offset="0" stop-color="#ff9ad5"/><stop offset=".5" stop-color="#7a45e6"/><stop offset="1" stop-color="#1b0f40"/></radialGradient>
      <linearGradient id="field" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8fd3ff"/><stop offset="1" stop-color="#3a8f4a"/></linearGradient>
      <linearGradient id="dusk3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffb347"/><stop offset="1" stop-color="#ff5e62"/></linearGradient>
      <linearGradient id="deep" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0090db"/><stop offset="1" stop-color="#003a6b"/></linearGradient></defs>
      <rect width="80" height="45" fill="url(#neb)"/>
      <g fill="#fff" opacity=".8"><circle cx="16" cy="10" r=".8"/><circle cx="60" cy="34" r=".9"/><circle cx="66" cy="8" r=".7"/></g>
      <rect x="80" width="80" height="45" fill="url(#field)"/>
      <path d="M80 34 C100 26 120 38 160 28 L160 45 L80 45Z" fill="#2d7a3c"/><circle cx="142" cy="12" r="5" fill="#fff6c8"/>
      <rect y="45" width="80" height="45" fill="url(#dusk3)"/>
      <path d="M0 78 C20 70 30 82 50 74 S70 76 80 72 L80 90 L0 90Z" fill="#7a2a3a"/><circle cx="30" cy="66" r="7" fill="#fff2c2"/>
      <rect x="80" y="45" width="80" height="45" fill="url(#deep)"/>
      <g fill="none" stroke="#9fe6ff" stroke-width="1.4" opacity=".7"><path d="M84 66 C96 58 106 74 118 66 S142 58 156 66"/><path d="M84 76 C96 68 106 84 118 76 S142 68 156 76"/></g>
      <rect x="1" y="1" width="78" height="43" fill="none" stroke="#fff" stroke-width="2"/>
      <line x1="80" y1="0" x2="80" y2="90" stroke="#000" stroke-width=".8"/><line x1="0" y1="45" x2="160" y2="45" stroke="#000" stroke-width=".8"/></svg>
  </div>
  <div class="card" style="left: 1664px; top: 498px; width: 196px; height: 294px; transform: rotate(5deg)">
    <svg viewBox="0 0 100 150" preserveAspectRatio="xMidYMid slice"><defs>
      <linearGradient id="desert" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffcf6b"/><stop offset="1" stop-color="#ff7b54"/></linearGradient></defs>
      <rect width="100" height="150" fill="url(#desert)"/>
      <circle cx="50" cy="62" r="24" fill="#fff1c4" opacity=".95"/>
      <path d="M0 98 C24 86 46 104 70 94 S94 90 100 92 L100 150 L0 150Z" fill="#d0602f"/>
      <path d="M0 118 C30 104 52 124 78 112 S96 110 100 112 L100 150 L0 150Z" fill="#9a3a22"/>
      <path d="M0 136 C22 128 48 140 70 132 S92 130 100 132 L100 150 L0 150Z" fill="#5c2016"/></svg>
  </div>

  <!-- The jellygoose. -->
  <svg class="goose" viewBox="104 6 210 242">
    <defs>
      <linearGradient id="bellGlow" gradientUnits="userSpaceOnUse" x1="126" y1="40" x2="274" y2="160"><stop offset="0" stop-color="#7A45E6"/><stop offset="1" stop-color="#0090DB"/></linearGradient>
      <linearGradient id="bellFill" gradientUnits="userSpaceOnUse" x1="150" y1="44" x2="250" y2="162"><stop offset="0" stop-color="#A98CFF"/><stop offset=".45" stop-color="#8A6BF2"/><stop offset="1" stop-color="#6A5BE0"/></linearGradient>
      <radialGradient id="shine" gradientUnits="userSpaceOnUse" cx="0" cy="0" r="34"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset=".7" stop-color="#fff" stop-opacity=".16"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
      <linearGradient id="strand" gradientUnits="userSpaceOnUse" x1="0" y1="150" x2="0" y2="236"><stop offset="0" stop-color="#B49BFF" stop-opacity=".95"/><stop offset=".5" stop-color="#8FA9F0" stop-opacity=".6"/><stop offset="1" stop-color="#5E86C8" stop-opacity=".12"/></linearGradient>
      <linearGradient id="beak" gradientUnits="userSpaceOnUse" x1="264" y1="97" x2="297" y2="135"><stop offset="0" stop-color="#FFC24A"/><stop offset="1" stop-color="#EE8412"/></linearGradient>
      <path id="bell" d="M129 145 C129 22 274 22 274 145 C264 156 247.75 156 237.75 145 C227.75 156 211.5 156 201.5 145 C191.5 156 175.25 156 165.25 145 C155.25 156 139 156 129 145Z"/>
      <clipPath id="bellClip"><use href="#bell"/></clipPath>
      <filter id="blur14" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
      <filter id="blur6" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
    </defs>
    <!-- Lit from inside: the bell's colour, blurred, under it. -->
    <use href="#bell" fill="url(#bellGlow)" filter="url(#blur14)" opacity=".85"/>
    <use href="#bell" fill="url(#bellGlow)" filter="url(#blur6)" opacity=".35"/>
    <g fill="none" stroke="url(#strand)" stroke-width="4" stroke-linecap="round">
      <path d="M150 148 C140 172 160 184 150 185 C141 196 157 210 147 222"/>
      <path d="M175 148 C165 172 185 184 175 190 C166 206 182 220 172 232"/>
      <path d="M200 148 C190 172 210 184 200 193 C191 212 207 226 197 238"/>
      <path d="M225 148 C215 172 235 184 225 189 C216 204 232 218 222 230"/>
      <path d="M250 148 C240 172 260 184 250 182 C241 190 257 204 247 216"/>
    </g>
    <use href="#bell" fill="url(#bellFill)"/>
    <g clip-path="url(#bellClip)">
      <g transform="translate(170 82) rotate(-24.06)">
        <ellipse cx="0" cy="0" rx="29" ry="13" fill="url(#shine)"/>
      </g>
    </g>
    <circle cx="224" cy="99" r="8" fill="#12102A"/>
    <circle cx="222.5" cy="96.5" r="2.5" fill="#fff" fill-opacity=".92"/>
    <path d="M264 97 L296.9 116 L264 135Z" fill="url(#beak)" stroke="#F9A82E" stroke-width="5" stroke-linejoin="round"/>
  </svg>
</div>
<script>
  // Bubbles and drifting specks, the same every time (a fixed seed).
  let seed = 7;
  const rand = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const host = document.getElementById('bubbles');
  for (let i = 0; i < 70; i++) {
    const r = rand() < .2 ? 4 + rand() * 7 : 1 + rand() * 2.6;
    const b = document.createElement('div');
    b.className = 'bubble';
    b.style.left = (rand() * 1920) + 'px';
    b.style.top = (rand() * 823) + 'px';
    b.style.width = b.style.height = (r * 2) + 'px';
    b.style.opacity = (.25 + rand() * .6).toFixed(2);
    if (r > 4) b.style.filter = 'blur(' + (rand() * 2).toFixed(1) + 'px)';
    host.appendChild(b);
  }
</script>
</body>
</html>
